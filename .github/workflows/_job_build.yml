name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      ref:
        description: 'Ref to build; defaults to whatever triggered the run'
        required: false
        type: string
        default: ''

jobs:
  proton:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_codeql: true
          remove_docker_images: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Report free disk space
        # Disk is the constraint that decides whether this job can run at all.
        # Print it rather than guess, and print it again after the build so a
        # failure elsewhere can be told apart from simply running out of room.
        run: df -h /

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-proton-${{ github.run_id }}
          restore-keys: |
            ccache-proton

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Patch
        run: |
          # Some submodules come from hosts that rate-limit CI. sourceware.org
          # has answered 429 for bzip2, which failed the whole job in its first
          # minute and threw away a queue slot for a build that takes hours.
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --filter=tree:0 --recursive; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::submodule checkout still failing after $attempt attempts"
              exit 1
            fi
            echo "submodule checkout failed (attempt $attempt), retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          # apply proton-ge-custom patches
          ./patches/protonprep-valve-staging.sh || true
          # strip binaries at compile time to save space in the runner
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          mkdir ./build

      - name: Verify the SwitchVN patches applied
        # protonprep runs with `|| true`, so a patch that fails to apply would
        # otherwise produce a build that looks fine and silently has no hardware
        # video decoding. Fail here instead.
        run: |
          fail=0
          check() {
            if grep -q "$2" "$1"; then
              echo "ok   $3"
            else
              echo "FAIL $3 (expected '$2' in $1)"
              fail=1
            fi
          }
          check wine/dlls/winedmo/unix_transform.c "transform_init_hw_decoding" "envideo hardware decoding"
          check wine/dlls/qasf/dmowrapper.c       "Decommit the output allocators" "dmowrapper stop-path deadlock fix"
          check wine/dlls/winedmo/wm_reader.c     "no longer committed"            "wm_reader decommit handling"
          # Not a patch but part of the same fix set, and it has been dropped by
          # a branch rewrite once already.
          # Match the condition, not just the option name: upstream already has
          # a nomfdxgiman option, and the first version of this default keyed on
          # platform.machine() == "aarch64", which never fires because Box64's
          # uname wrapper reports x86_64 to the runtime Python this script runs
          # under. It has to probe for the Tegra node instead.
          check proton 'os.path.exists("/dev/nvhost-nvdec") and "mfdxgiman" not in self.compat_config' \
                "Media Foundation system-memory default, keyed on the Tegra node"
          if grep -q 'platform.machine() == "aarch64" and "mfdxgiman"' proton; then
            echo "FAIL the Media Foundation default is keyed on platform.machine(), which is x86_64 under Box64"
            fail=1
          fi
          exit $fail

      - name: Configure
        working-directory: ./build
        run: |
          ../configure.sh --build-name=${{ inputs.name }} --container-engine=docker

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          make -j$(nproc) redist

      - name: Report free disk space after build
        if: always()
        run: df -h /

      - name: Save cache
        id: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact ${{ inputs.name }}.tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.tar.gz
          path: ./build/${{ inputs.name }}.tar.gz

      - name: Upload artifact ${{ inputs.name }}.sha512sum
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.sha512sum
          path: ./build/${{ inputs.name }}.sha512sum

