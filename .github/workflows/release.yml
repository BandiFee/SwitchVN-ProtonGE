name: Release

permissions:
  contents: write

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'GE-Proton*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. GE-Proton11-5-SwitchVN-1)'
        required: true

# A tag push sets ref_name to the tag; a manual run sets it to the branch, so
# the tag has to come from the input instead. Everything downstream - the build
# name, the release, the asset names - derives from this one value.
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: ${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_job_build.yml
    with:
      name: ${{ github.event.inputs.tag || github.ref_name }}
      # Build the tag's tree, not the branch head, so the asset matches the tag
      # even when the run was started by hand well after the tag was made.
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Tags
      shell: bash
      run: |
        git fetch origin +refs/tags/*:refs/tags/*
    - name: Create Release
      id: create
      shell: bash
      run: |
        # gh rejects --notes-from-tag together with --repo. This job checks the
        # repository out at the workspace root, so gh can infer it from the git
        # remote and --repo is unnecessary on the create call.
        if gh release view "$TAG" --repo "${{ github.server_url }}/${{ github.repository }}" &>/dev/null; then
          echo "Release $TAG already exists. Skipping creation."
        else
          gh release create "$TAG" \
            --latest \
            --title "$TAG Released" \
            --notes-from-tag \
            --verify-tag
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: Upload
    needs: release
    uses: ./.github/workflows/_job_upload.yml
    with:
      version: ${{ github.event.inputs.tag || github.ref_name }}
      name: ${{ github.event.inputs.tag || github.ref_name }}
